services:
  novelty:
    build:
      context: .
    image: fashion-planner-novelty:local
    ports:
      - "127.0.0.1:8767:8767"
    environment:
      NOVELTY_HOST: 0.0.0.0
      NOVELTY_HTTP_MODE: service
      NOVELTY_PORT: "8767"
      NOVELTY_TLS_CERT_FILE: /run/secrets/server_cert
      NOVELTY_TLS_KEY_FILE: /run/secrets/server_key
      FASHION_PLANNER_SERVICE_TOKEN: ${FASHION_PLANNER_SERVICE_TOKEN:?Set the shared agent bearer token}
      NOVELTY_DRAFT_IMAGE_PROVIDER: ${NOVELTY_DRAFT_IMAGE_PROVIDER:-}
      NOVELTY_TEXT_GENERATION_ENABLED: ${NOVELTY_TEXT_GENERATION_ENABLED:-true}
      NOVELTY_TEXT_GENERATION_MODEL: ${NOVELTY_TEXT_GENERATION_MODEL:-gpt-6-luna}
      NOVELTY_TEXT_GENERATION_TIMEOUT_SECONDS: ${NOVELTY_TEXT_GENERATION_TIMEOUT_SECONDS:-60}
      NOVELTY_TEXT_GENERATION_MAX_OUTPUT_TOKENS: ${NOVELTY_TEXT_GENERATION_MAX_OUTPUT_TOKENS:-3000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      NOVELTY_DRAFT_ARTIFACT_DIR: /app/data/local/novelty-artifacts
    volumes:
      - novelty-data:/app/data/local
    secrets:
      - server_cert
      - server_key
      - server_ca
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,ssl; from urllib.request import Request,urlopen; r=Request('https://127.0.0.1:8767/api/health',headers={'Authorization':'Bearer '+os.environ['FASHION_PLANNER_SERVICE_TOKEN']}); urlopen(r,timeout=3,context=ssl.create_default_context(cafile='/run/secrets/server_ca'))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  novelty-data:

secrets:
  server_cert:
    file: ${NOVELTY_TLS_CERT_HOST_PATH:?Set the local TLS certificate path}
  server_key:
    file: ${NOVELTY_TLS_KEY_HOST_PATH:?Set the local TLS private key path}
  server_ca:
    file: ${NOVELTY_TLS_CA_HOST_PATH:?Set the TLS CA certificate path for healthcheck verification}
